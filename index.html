<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#1A6FA0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📁</text></svg>">
    <title>העלאת תמונות - מכון בקרה ניסים שוקר</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="header__brand">
            <img src="LOGO.png" alt="מכון בקרה ניסים שוקר" class="header__logo">
        </div>
        <div class="header__accent"></div>
    </header>

    <!-- Offline upload queue notification (shown when photos couldn't be uploaded) -->
    <div id="offline-banner" class="offline-banner" hidden>
        <div class="offline-banner__body">
            <span class="offline-banner__icon">⚠️</span>
            <span id="offline-banner-text" class="offline-banner__text"></span>
            <button id="offline-close-btn" class="offline-banner__close-btn" type="button" title="סגור">סגור</button>
        </div>
        <button id="offline-download-btn" class="offline-banner__download-btn" type="button" hidden>
            ⬇️ הורד תמונות למכשיר
        </button>
    </div>

    <!-- Confirmation dialog for clearing the offline queue -->
    <div id="offline-confirm-overlay" class="offline-confirm-overlay" hidden>
        <div class="offline-confirm-dialog" role="dialog" aria-modal="true">
            <p class="offline-confirm-dialog__msg">הפעולה תסגור את ההתראה ותנקה את התמונות באחסון הזמני</p>
            <div class="offline-confirm-dialog__actions">
                <button id="offline-confirm-proceed" class="btn offline-confirm-dialog__btn offline-confirm-dialog__btn--danger" type="button">המשך</button>
                <button id="offline-confirm-cancel" class="btn offline-confirm-dialog__btn offline-confirm-dialog__btn--secondary" type="button">בטל</button>
            </div>
        </div>
    </div>

    <main class="main">
        <!-- Saved location -->
        <div id="saved-location" class="saved-location" hidden>
            <div class="saved-location__card">
                <div class="saved-location__icon">📁</div>
                <div class="saved-location__info">
                    <p class="saved-location__label">המשך מהמיקום האחרון:</p>
                    <p id="saved-location-path" class="saved-location__path"></p>
                </div>
            </div>
            <button id="saved-location-btn" class="btn btn--primary saved-location__btn" type="button">המשך</button>
            <button id="saved-location-change" class="saved-location__change" type="button">בחר תיקיה אחרת</button>
        </div>

        <!-- Back button + Breadcrumb navigation -->
        <div id="nav-bar" class="nav-bar" hidden>
            <button id="back-btn" class="btn btn--back" type="button" title="חזרה">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <polyline points="9 6 15 12 9 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <nav id="breadcrumbs" class="breadcrumbs"></nav>
        </div>

        <!-- Auto-selection notification -->
        <div id="auto-msg" class="auto-msg" hidden></div>

        <!-- Search / filter -->
        <div id="search-box" class="search-box" hidden>
            <svg class="search-box__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21l-4.35-4.35"/>
            </svg>
            <input type="search" id="search-input" class="search-box__input" placeholder="חיפוש פרויקט..." autocomplete="off">
        </div>

        <!-- Loading spinner -->
        <div id="loading" class="loading" hidden>
            <div class="loading__spinner"></div>
            <span class="loading__text">טוען תיקיות...</span>
        </div>

        <!-- Error state -->
        <div id="error" class="error" hidden>
            <p id="error-text" class="error__text"></p>
            <button id="retry-btn" class="btn btn--primary">נסה שוב</button>
        </div>

        <!-- Empty folder state -->
        <div id="empty" class="empty" hidden>
            <p class="empty__text">תיקיה ריקה</p>
        </div>

        <!-- Folder list -->
        <ul id="folder-list" class="folder-list"></ul>

        <!-- Target folder (תמונות) indicator -->
        <div id="target-folder" class="target-folder" hidden>
            <div class="target-folder__badge">תיקיית יעד</div>
            <p id="target-path" class="target-folder__path"></p>
            <p id="target-note" class="target-folder__note"></p>
        </div>

        <!-- Photo upload section -->
        <div id="upload-section" class="upload-section" hidden>
            <div class="upload-section__header">
                <h2 class="upload-section__title">העלאת תמונות</h2>
                <div class="upload-section__buttons">
                    <label class="btn btn--secondary btn--add-photos">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                        גלריה
                        <input type="file" id="photo-input" accept="image/*" multiple hidden>
                    </label>
                    <label class="btn btn--secondary btn--add-photos">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        מצלמה
                        <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
                    </label>
                </div>
            </div>
            <ul id="photo-list" class="photo-list"></ul>
            <button id="upload-btn" class="btn btn--primary btn--upload" type="button" disabled>
                העלאה
            </button>
            <div id="upload-progress" class="upload-progress" hidden>
                <div class="upload-progress__bar">
                    <div id="progress-fill" class="upload-progress__fill"></div>
                </div>
                <p id="progress-text" class="upload-progress__text"></p>
            </div>
            <div id="upload-result" class="upload-result" hidden>
                <p id="result-text" class="upload-result__text"></p>
                <button id="result-close-btn" class="btn btn--secondary" type="button">סגור</button>
            </div>
        </div>

        <!-- Files section (collapsible) -->
        <div id="files-section" class="files-section" hidden>
            <button id="files-toggle" class="files-section__toggle" type="button">
                <span id="files-toggle-icon" class="files-section__chevron">◀</span>
                <span id="files-toggle-text">קבצים</span>
            </button>
            <div id="files-sort" class="files-sort" hidden>
                <span class="files-sort__label">מיון:</span>
                <button id="files-sort-date" class="files-sort__btn" type="button">תאריך</button>
                <button id="files-sort-name" class="files-sort__btn" type="button">שם</button>
            </div>
            <ul id="file-list" class="file-list"></ul>
        </div>

        <!-- Create דוחות ביקור folder -->
        <div id="create-reports" class="create-visit" hidden>
            <button id="create-reports-btn" class="btn btn--secondary" type="button">
                + יצירת תיקיית דוחות ביקור
            </button>
            <div id="reports-creating" class="create-visit__creating" hidden>
                <div class="loading__spinner loading__spinner--small"></div>
                <span>יוצר תיקיה...</span>
            </div>
            <p id="reports-error" class="create-visit__error" hidden></p>
        </div>

        <!-- Create new visit -->
        <div id="create-visit" class="create-visit" hidden>
            <button id="create-visit-btn" class="btn btn--secondary" type="button">
                + יצירת ביקור חדש
            </button>
            <div id="visit-form" class="create-visit__form" hidden>
                <label for="visit-name" class="create-visit__label">שם התיקיה שתיווצר:</label>
                <input type="text" id="visit-name" class="create-visit__input" dir="rtl">
                <div id="visit-copy-prompt" class="copy-prompt" hidden>
                    <p class="copy-prompt__text">מאיזה ביקור להעתיק דוחות?</p>
                    <button id="copy-choice-number" class="btn btn--secondary copy-prompt__btn" type="button"></button>
                    <button id="copy-choice-date" class="btn btn--secondary copy-prompt__btn" type="button"></button>
                    <button id="copy-skip" class="copy-prompt__skip" type="button">דלג על העתקה</button>
                </div>
                <button id="confirm-visit-btn" class="btn btn--primary" type="button">צור תיקיה</button>
                <div id="visit-creating" class="create-visit__creating" hidden>
                    <div class="loading__spinner loading__spinner--small"></div>
                    <span>יוצר תיקיה...</span>
                </div>
                <p id="visit-error" class="create-visit__error" hidden></p>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
